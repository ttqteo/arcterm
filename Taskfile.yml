version: "3"

vars:
    BIN_DIR: "bin"
    VERSION:
        sh: node version.cjs
    RMRF: '{{if eq OS "windows"}}powershell -NoProfile -NonInteractive Remove-Item -Force -Recurse -ErrorAction SilentlyContinue{{else}}rm -rf{{end}}'
    DATE: '{{if eq OS "windows"}}powershell -NoProfile -NonInteractive Get-Date -UFormat{{else}}date{{end}}'

tasks:
    tauri:dev:
        desc: Run the Tauri application via the Vite dev server (enables hot reloading). Arguments after -- go to `cargo tauri dev`, e.g. `task dev -- --config <file>`.
        cmd: npm run dev -- {{.CLI_ARGS}}
        aliases:
            - dev
        deps:
            - npm:install
            - sync:piartifacts
            - sync:claudemod
            - tauri:sync-version
            - build:backend:devhost
            - build:backend:devhost:full
        env:
            WAVETERM_ENVFILE: "{{.ROOT_DIR}}/.env"
            WAVETERM_NOCONFIRMQUIT: "1"

    tauri:sync-version:
        desc: Write package.json's version into every file that carries a copy (src-tauri/tauri.conf.json, src-tauri/Cargo.toml) so the installer, the crate, and app.getVersion() agree (package.json stays the single source of truth).
        cmds:
            - node scripts/sync-tauri-version.mjs

    check:version:
        desc: Fail if any version site has drifted from package.json, without writing anything.
        cmd: node scripts/sync-tauri-version.mjs --check

    tauri:build:
        desc: "Production build: optionally bump the version, sync it everywhere, build the backend, and bundle the installer. BUMP=none|patch|minor|major (default none) controls the bump — pass one for a release."
        aliases:
            - build:app
        cmds:
            # The bump must run in its own `task` process. Task resolves the global VERSION var once
            # per invocation, so bumping and building in one run would stamp the Go binaries and the
            # wsh-<version> filenames with the pre-bump version.
            - node version.cjs {{.BUMP | default "none"}}
            # a nested `task:` call would reuse this process and its stale VERSION, so shell out.
            # That makes it a CLI invocation, which is why the callee cannot be marked internal.
            - task tauri:build:post-bump

    tauri:build:post-bump:
        desc: The post-bump half of tauri:build. Call tauri:build instead — on its own this builds whatever version package.json currently holds, without bumping.
        cmds:
            - task: tauri:sync-version
            - task: check:version
            - task: build:backend
            - cargo tauri build

    install:
        desc: "Install the last `task tauri:build` over the installed arcterm, with no installer pages: /P passive, /UPDATE installs over instead of uninstalling first, /R reopens arcterm. It closes the running arcterm and every agent in it."
        platforms: [windows]
        cmd: '"src-tauri/target/release/bundle/nsis/arcterm_{{.VERSION}}_x64-setup.exe" /P /UPDATE /R'

    verify:ui:
        desc: Run the CDP verification harness against the running dev app (scripts/cdp/). Pass scenario names after --, e.g. `task verify:ui -- surface-smoke`. CDP_PORT env overrides the attach port (default 9222) for a worktree dev app on another port.
        cmd: node scripts/cdp/verify.mjs {{.CLI_ARGS}}

    worktree:prepare:
        desc: Junction node_modules, src-tauri/target, and dist/bin from the main checkout into the current worktree (Windows). Run inside the worktree before `task dev`.
        cmd: node scripts/worktree-junctions.mjs prepare

    worktree:cleanup:
        desc: Remove junction links, then the worktree and its branch. Pass the worktree path after --, e.g. `task worktree:cleanup -- .worktrees/foo` (defaults to cwd). Never touches a real directory.
        cmd: node scripts/worktree-junctions.mjs cleanup {{.CLI_ARGS}}

    build:backend:
        desc: Build the wavesrv and wsh components.
        cmds:
            - task: build:server
            - task: build:wsh

    build:backend:quickdev:
        desc: Build only the wavesrv component for quickdev (arm64 macOS only, no generate, no wsh).
        cmds:
            - task: build:server:quickdev
        sources:
            - go.mod
            - go.sum
            - pkg/**/*.go
            - pkg/**/*.sh
            - cmd/**/*.go
            - package.json

    build:schema:
        desc: Build the schema for configuration.
        sources:
            - "cmd/generateschema/*.go"
            - "pkg/wconfig/*.go"
        generates:
            - "dist/schema/**/*"
        cmds:
            - go run cmd/generateschema/main-generateschema.go
            - cmd: '{{.RMRF}} "dist/schema"'
              ignore_error: true
            - task: copyfiles:'schema':'dist/schema'

    build:server:
        desc: Build the wavesrv component.
        cmds:
            - task: build:server:linux
            - task: build:server:macos
            - task: build:server:windows
        deps:
            - go:mod:tidy
            - generate
        sources:
            - "cmd/server/*.go"
            - "pkg/**/*.go"
            - "pkg/**/*.json"
            - "pkg/**/*.sh"
            - package.json
        generates:
            - dist/bin/wavesrv.*

    build:server:macos:
        desc: Build the wavesrv component for macOS (Darwin) platforms (generates artifacts for both arm64 and amd64).
        platforms: [darwin]
        cmds:
            - cmd: rm -f dist/bin/wavesrv*
              ignore_error: true
            - task: build:server:internal
              vars:
                  ARCHS: arm64,amd64
                  # without it clang stamps the build machine's macOS as the minimum; 13.0 is Go's own
                  # floor and src-tauri/tauri.macos.conf.json's minimumSystemVersion. The flag rides in
                  # CGO_CFLAGS because Go's build cache keys on that, not on MACOSX_DEPLOYMENT_TARGET.
                  GO_ENV_VARS: CGO_CFLAGS="-O2 -g -mmacosx-version-min=13.0" MACOSX_DEPLOYMENT_TARGET=13.0

    build:server:quickdev:
        desc: Build the wavesrv component for quickdev (arm64 macOS only, no generate).
        platforms: [darwin]
        cmds:
            - task: build:server:internal
              vars:
                  ARCHS: arm64
        deps:
            - go:mod:tidy
        sources:
            - "cmd/server/*.go"
            - "pkg/**/*.go"
            - "pkg/**/*.json"
            - "pkg/**/*.sh"
            - package.json
        generates:
            - dist/bin/wavesrv.*

    build:backend:quickdev:windows:
        desc: Build only the wavesrv component for quickdev (Windows amd64 only, no generate, no wsh).
        platforms: [windows]
        cmds:
            - task: build:server:internal
              vars:
                  ARCHS: amd64
                  GO_ENV_VARS: CC="zig cc -target x86_64-windows-gnu"
        deps:
            - go:mod:tidy
        sources:
            - "cmd/server/*.go"
            - "pkg/**/*.go"
            - "pkg/**/*.json"
            - "pkg/**/*.sh"
            - package.json
        generates:
            - dist/bin/wavesrv.x64.exe

    # dev-loop backend: wavesrv + wsh for the dev host only, without the release build's clean and
    # strip (build:backend). Linux has no quickdev flavor, so it falls back to the full build. `platforms` must live at task level here: this Task version
    # silently ignores per-cmd `platforms`.
    build:backend:devhost:
        desc: Build wavesrv + wsh for the dev host only (windows/darwin); release goes through build:backend.
        internal: true
        platforms: [windows, darwin]
        cmds:
            - task: build:backend:quickdev
            - task: build:backend:quickdev:windows
            - task: build:wsh:devhost

    build:backend:devhost:full:
        desc: Fallback backend build for hosts without a quickdev flavor (linux uses build:backend).
        internal: true
        platforms: [linux]
        cmds:
            - task: build:backend

    build:wsh:devhost:
        desc: Build wsh for the dev host OS/arch only (dev loop).
        internal: true
        platforms: [windows, darwin]
        deps:
            - go:mod:tidy
            - generate
        vars:
            HOSTGOOS:
                sh: echo {{if eq OS "windows"}}windows{{else}}darwin{{end}}
            HOSTARCH:
                sh: echo {{if eq "arm" ARCH}}arm64{{else}}{{ARCH}}{{end}}
        sources:
            - "cmd/wsh/**/*.go"
            - "pkg/**/*.go"
            - package.json
        generates:
            - "dist/bin/wsh*"
        cmds:
            - task: build:wsh:internal
              vars:
                  GOOS: "{{.HOSTGOOS}}"
                  GOARCH: "{{.HOSTARCH}}"

    build:server:windows:
        desc: Build the wavesrv component for Windows platforms (only generates artifacts for the current architecture).
        platforms: [windows]
        cmds:
            - cmd: powershell -NoProfile -NonInteractive -Command "Remove-Item -Force -ErrorAction SilentlyContinue -Path dist/bin/wavesrv*"
              ignore_error: true
            - task: build:server:internal
              vars:
                  ARCHS:
                      sh: echo {{if eq "arm" ARCH}}arm64{{else}}{{ARCH}}{{end}}
                  GO_ENV_VARS:
                      sh: echo "{{if eq "amd64" ARCH}}CC=\"zig cc -target x86_64-windows-gnu\"{{else}}CC=\"zig cc -target aarch64-windows-gnu\"{{end}}"
                  # drops DWARF only (31 MB -> 18 MB); panic stacks come from pclntab and survive
                  GO_LDFLAGS: -s -w

    build:server:linux:
        desc: Build the wavesrv component for Linux platforms (only generates artifacts for the current architecture).
        platforms: [linux]
        cmds:
            - cmd: rm -f dist/bin/wavesrv*
              ignore_error: true
            - task: build:server:internal
              vars:
                  ARCHS:
                      sh: echo {{if eq "arm" ARCH}}arm64{{else}}{{ARCH}}{{end}}
                  GO_ENV_VARS:
                      sh: echo "{{if eq "amd64" ARCH}}CC=\"zig cc -target x86_64-linux-gnu.2.28\"{{else}}CC=\"zig cc -target aarch64-linux-gnu.2.28\"{{end}}"

    sync:pi-theme:
        desc: Regenerate pi/themes/arc.json palette vars from the cockpit @theme tokens (tailwindsetup.css).
        cmds:
            - cmd: node scripts/sync-pi-theme.mjs --write
        sources:
            - frontend/tailwindsetup.css
        generates:
            - pi/themes/arc.json

    sync:piartifacts:
        desc: Copy authored pi/ artifacts into their go:embed locations under cmd/wsh/cmd (generated, never hand-edited).
        deps:
            - sync:pi-theme
        cmds:
            - cmd: cp pi/extensions/waveterm-status.ts cmd/wsh/cmd/pi-status-extension.ts
            - cmd: cp pi/themes/arc.json cmd/wsh/cmd/arc-theme.json
            - cmd: cp pi/extensions/waveterm-tools.ts cmd/wsh/cmd/pi-tools-extension.ts
            - cmd: cp pi/extensions/waveterm-tools-core.ts cmd/wsh/cmd/pi-tools-core-extension.ts
            - cmd: cp pi/extensions/waveterm-ask.ts cmd/wsh/cmd/pi-ask-extension.ts
            - cmd: cp pi/extensions/waveterm-ask-core.ts cmd/wsh/cmd/pi-ask-core-extension.ts
            - cmd: cp pi/extensions/waveterm-prose-core.ts cmd/wsh/cmd/pi-prose-core-extension.ts
            - cmd: cp pi/extensions/waveterm-simplify-gate.ts cmd/wsh/cmd/pi-simplify-gate-extension.ts
            - cmd: cp pi/extensions/waveterm-simplify-gate-core.ts cmd/wsh/cmd/pi-simplify-gate-core-extension.ts
        sources:
            - pi/extensions/waveterm-status.ts
            - pi/themes/arc.json
            - pi/extensions/waveterm-tools.ts
            - pi/extensions/waveterm-tools-core.ts
            - pi/extensions/waveterm-ask.ts
            - pi/extensions/waveterm-ask-core.ts
            - pi/extensions/waveterm-prose-core.ts
            - pi/extensions/waveterm-simplify-gate.ts
            - pi/extensions/waveterm-simplify-gate-core.ts
        generates:
            - cmd/wsh/cmd/pi-status-extension.ts
            - cmd/wsh/cmd/arc-theme.json
            - cmd/wsh/cmd/pi-tools-extension.ts
            - cmd/wsh/cmd/pi-tools-core-extension.ts
            - cmd/wsh/cmd/pi-ask-extension.ts
            - cmd/wsh/cmd/pi-ask-core-extension.ts
            - cmd/wsh/cmd/pi-prose-core-extension.ts
            - cmd/wsh/cmd/pi-simplify-gate-extension.ts
            - cmd/wsh/cmd/pi-simplify-gate-core-extension.ts

    sync:claudemod:
        desc: Copy the authored Claude mods (claude/arc-mod, claude/arc-view-mod) into their go:embed locations cmd/wsh/cmd/claude-mod and claude-view-mod (generated, never hand-edited), without their tests or engine-written types.
        cmds:
            - for: [{ src: arc-mod, dst: claude-mod }, { src: arc-view-mod, dst: claude-view-mod }]
              cmd: rm -rf cmd/wsh/cmd/{{.ITEM.dst}} && cp -r claude/{{.ITEM.src}} cmd/wsh/cmd/{{.ITEM.dst}} && rm -rf cmd/wsh/cmd/{{.ITEM.dst}}/.claude-plugin/types && rm -f cmd/wsh/cmd/{{.ITEM.dst}}/hooks/*.test.ts
        sources:
            - claude/arc-mod/**/*
            - claude/arc-view-mod/**/*
        generates:
            - cmd/wsh/cmd/claude-mod/**/*
            - cmd/wsh/cmd/claude-view-mod/**/*

    build:server:internal:
        deps:
            - sync:piartifacts
            - sync:claudemod
        requires:
            vars:
                - ARCHS
        cmd:
            cmd: CGO_ENABLED=1 CGO_CFLAGS="-O2 -g" GOARCH={{.GOARCH}} {{.GO_ENV_VARS}} go build -tags "osusergo,sqlite_omit_load_extension" -ldflags "{{.GO_LDFLAGS}} -X main.BuildTime=$({{.DATE}} +'%Y%m%d%H%M') -X main.WaveVersion={{.VERSION}}" -o dist/bin/wavesrv.{{if eq .GOARCH "amd64"}}x64{{else}}{{.GOARCH}}{{end}}{{exeExt}} cmd/server/main-server.go
            for:
                var: ARCHS
                split: ","
                as: GOARCH
        internal: true

    build:wsh:
        desc: Build the wsh component for windows x64, the only target the installer bundles.
        cmds:
            - cmd: rm -f dist/bin/wsh*
              platforms: [darwin, linux]
              ignore_error: true
            - cmd: powershell -NoProfile -NonInteractive -Command "Remove-Item -Force -ErrorAction SilentlyContinue -Path dist/bin/wsh*"
              platforms: [windows]
              ignore_error: true
            - task: build:wsh:internal
              vars:
                  GOOS: windows
                  GOARCH: amd64
        deps:
            - go:mod:tidy
            - generate
        sources:
            - "cmd/wsh/**/*.go"
            - "pkg/**/*.go"
            - package.json
        generates:
            - "dist/bin/wsh*"

    build:wsh:internal:
        deps:
            - sync:piartifacts
            - sync:claudemod
        vars:
            EXT:
                sh: echo {{if eq .GOOS "windows"}}.exe{{end}}
            NORMALIZEDARCH:
                sh: echo {{if eq .GOARCH "amd64"}}x64{{else}}{{.GOARCH}}{{end}}
        requires:
            vars:
                - GOOS
                - GOARCH
                - VERSION
        cmd: (CGO_ENABLED=0 GOOS={{.GOOS}} GOARCH={{.GOARCH}} go build -ldflags="-s -w -X main.BuildTime=$({{.DATE}} +'%Y%m%d%H%M') -X main.WaveVersion={{.VERSION}}" -o dist/bin/wsh-{{.VERSION}}-{{.GOOS}}.{{.NORMALIZEDARCH}}{{.EXT}} cmd/wsh/main-wsh.go)
        internal: true

    generate:
        desc: Generate Typescript bindings for the Go backend.
        cmds:
            - go run cmd/generatets/main-generatets.go
            - go run cmd/generatego/main-generatego.go
        deps:
            - build:schema
        sources:
            - "cmd/generatego/*.go"
            - "cmd/generatets/*.go"
            - "pkg/**/*.go"
        # don't add generates key (otherwise will always execute)

    outdated:
        desc: Check for outdated packages using npm-check-updates.
        cmd: npx npm-check-updates@latest

    version:
        desc: Get the current package version, or bump version if args are present. To pass args to `version.cjs`, add them after `--`. See `version.cjs` for usage definitions for the arguments.
        cmd: node version.cjs {{.CLI_ARGS}}

    dev:clearconfig:
        desc: Clear the dev app's config directory. Stop the dev app first.
        platforms: [windows]
        cmd: '{{.RMRF}} "$LOCALAPPDATA/dev.arc.app-dev/config"'

    dev:cleardata:
        desc: Clear the dev app's data directory (object store). Stop the dev app first.
        platforms: [windows]
        cmd: '{{.RMRF}} "$LOCALAPPDATA/dev.arc.app-dev/data"'

    check:ts:
        desc: Typecheck TypeScript code (frontend).
        cmd: node --stack-size=4000 node_modules/typescript/lib/tsc.js --noEmit
        deps:
            - npm:install

    check:pi-theme:
        desc: Validate pi/themes/arc.json against the pi theme schema and the cockpit @theme tokens.
        cmds:
            - cmd: node scripts/validate-pi-theme.mjs
            - cmd: node scripts/sync-pi-theme.mjs

    init:
        desc: Initialize the project for development.
        cmds:
            - npm install
            - go mod tidy

    npm:install:
        desc: Runs `npm install`
        internal: true
        generates:
            - node_modules/**/*
            - package-lock.json
        sources:
            - package-lock.json
            - package.json
        cmd: npm install

    go:mod:tidy:
        desc: Runs `go mod tidy`
        internal: true
        generates:
            - go.sum
        sources:
            - go.mod
        cmd: go mod tidy

    copyfiles:*:*:
        desc: Recursively copy directory and its contents.
        internal: true
        cmd: '{{if eq OS "windows"}}powershell -NoProfile -NonInteractive Copy-Item -Recurse -Force -Path {{index .MATCH 0}} -Destination {{index .MATCH 1}}{{else}}mkdir -p "$(dirname {{index .MATCH 1}})" && cp -r {{index .MATCH 0}} {{index .MATCH 1}}{{end}}'

    clean:
        desc: clean make/dist directories
        cmds:
            - cmd: '{{.RMRF}} "make"'
              ignore_error: true
            - cmd: '{{.RMRF}} "dist"'
              ignore_error: true

    godoc:
        desc: Start the Go documentation server for the root module
        cmd: $(go env GOPATH)/bin/pkgsite -http=:6060
