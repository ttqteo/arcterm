[package]
name = "wave-tauri"
version = "0.15.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
open = "5"
# already in the tree via Tauri; clock gives local-time log timestamps
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# already in the tree via Tauri; a oneshot carries the capture result back from the main thread
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
# Job Object APIs to tie wavesrv's lifetime to wave-tauri's (KILL_ON_JOB_CLOSE), and the window-icon
# calls that load icon.ico's frames from the exe's resource, and the process AppUserModelID. Pinned
# to the version already in the tree via Tauri so no duplicate copy is pulled.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# WebView2 CapturePreview into an in-memory stream (canvas.rs). Pinned to the versions already
# in the tree via Tauri/wry so no duplicate copy is pulled.
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory"] }
# WinRT toasts with an activation callback (notify.rs): a click focuses the window and opens what the toast is about,
# which tauri-plugin-notification cannot report on desktop
tauri-winrt-notification = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-notification = "~2.4"
