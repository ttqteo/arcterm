[package]
name = "wave-tauri"
version = "0.15.17"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
open = "5"
# already in the tree via Tauri; clock gives local-time log timestamps
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# already in the tree via Tauri; a oneshot carries the capture result back from the main thread
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
# Job Object APIs to tie wavesrv's lifetime to wave-tauri's (KILL_ON_JOB_CLOSE), and the window-icon
# calls that load icon.ico's frames from the exe's resource, and the process AppUserModelID, and the
# modifier state of the page's reload keys (pagekeys.rs). Pinned to the version already in the tree via
# Tauri so no duplicate copy is pulled.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# WebView2 CapturePreview into an in-memory stream (canvas.rs), and the reload keys and app frames
# (pagekeys.rs). Pinned to the versions already
# in the tree via Tauri/wry so no duplicate copy is pulled.
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }
# WinRT toasts with an activation callback (notify.rs): a click focuses the window and opens what the toast is about,
# which tauri-plugin-notification cannot report on desktop
tauri-winrt-notification = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
# Notification Center banners that report their click (notify.rs), which tauri-plugin-notification, built on this crate,
# does not pass on. Pinned to the version that plugin pulled into the tree.
mac-notification-sys = "0.6.15"
# the window's traffic lights, yellow button, ⌘M and ⌘W (macwindow.rs), which Tauri cannot hide or redirect, and the key
# a folded window takes when arcterm comes to the front. Pinned to the versions already in the tree via tao.
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow", "NSPanel", "NSStatusItem", "NSStatusBarButton", "NSColor", "NSFont", "NSAttributedString"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSNotification", "NSString", "NSAttributedString", "NSRange"] }
# the window list behind the fold that follows you out of the app (foreground.rs), which AppKit's occlusion state could
# not answer. Pinned to the versions already in the tree via tao.
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGGeometry", "CGWindow"] }
# the main dispatch queue, where tao queues a window's size and place (macwindow::after_tao_frame). Pinned to the
# version already in the tree via tao.
dispatch2 = "=0.3.1"
# the cancellation handler the status item takes while the tray popover shows (macwindow::present_from_tray). Pinned
# to the version already in the tree via objc2-app-kit.
block2 = "=0.6.2"

# tests only: catch the Objective-C exception a test throws on purpose (macwindow's exception log); a dev-dependency's
# features stay out of the app's own build
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = { version = "=0.6.4", features = ["exception"] }

# A debug build keeps line tables only, which panic stacks need, and dependencies keep no debug info: full debug info
# made src-tauri/target several times larger and its builds and links slower, and nobody steps into a dependency here.
# Release builds already carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
